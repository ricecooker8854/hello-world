<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Learning Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f6f8fa;
            color: #24292f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 32px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 3px 6px rgba(140, 149, 159, 0.15);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #0969da;
        }
        p {
            font-size: 14px;
            color: #57609a;
            line-height: 1.6;
        }
        .status {
            display: inline-block;
            margin-top: 16px;
            padding: 6px 12px;
            background-color: #dafbe1;
            color: #1a7f37;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello, GitHub! 🚀</h1>
        <p>Git / GitHubの学習用リポジトリへようこそ。</p>
        <p>このファイル（index.html）を編集して変更内容をコミット（commit）＆プッシュ（push）してみましょう！</p>
        <div class="status">Status: Active</div>
    </div>
</body>
</html>
